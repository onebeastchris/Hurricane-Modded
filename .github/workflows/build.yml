name: Publish

on:
  workflow_dispatch:
  push:
   paths-ignore:
     - '.gitignore'
     - 'CONTRIBUTING.md'
     - 'LICENSE'
     - 'README.md'
     - 'licenseheader.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@72f2cec99f417b1a1c5e2e88945068983b7965f9
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - uses: gradle/wrapper-validation-action@56b90f209b02bf6d1deae490e9ef18b21a389cd4
      - uses: actions/setup-java@4075bfc1b51bf22876335ae1cd589602d60d8758
        with:
          distribution: 'temurin'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin latest NeoForge 26.3 build
        run: |
          V=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE '<version>26\.3\.0\.[0-9]+(-beta)?</version>' | sed -E 's#</?version>##g' | sort -t. -k4,4n | tail -1)
          echo "NeoForge: $V"; test -n "$V"
          sed -i -E "s/^neoforge-version = .*/neoforge-version = \"$V\"/" gradle/libs.versions.toml
          grep neoforge-version gradle/libs.versions.toml
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Inspect 26.3 classes
        if: always()
        run: |
          J=$(find ~/.gradle/caches -path '*loom*' -name 'minecraft-*.jar' -size +5M 2>/dev/null | grep -viE 'sources|neoforge' | head -1)
          [ -z "$J" ] && J=$(find ~/.gradle/caches . -name '*.jar' -size +10M 2>/dev/null | while read f; do unzip -l "$f" 2>/dev/null | grep -q 'net/minecraft/world/level/block/PointedDripstoneBlock.class' && echo "$f" && break; done)
          echo "jar: $J" | tee inspect.txt
          for c in net.minecraft.world.level.block.PointedDripstoneBlock net.minecraft.world.level.block.BambooStalkBlock net.minecraft.world.level.block.state.BlockBehaviour; do
            echo "##### $c" >> inspect.txt; javap -p -cp "$J" $c | grep -iE 'shape|class ' >> inspect.txt
          done
          echo "##### ServerPlayerGameMode strings" >> inspect.txt
          javap -p -c -constants -cp "$J" net.minecraft.server.level.ServerPlayerGameMode | grep -iE 'Mismatch|ldc.*destroy|handleBlockBreakAction' >> inspect.txt
          cat inspect.txt
      - name: Smoke test - boot a dedicated server with the mod (fabric + neoforge)
        run: |
          set +e
          for p in fabric neoforge; do
            mkdir -p $p/run && echo "eula=true" > $p/run/eula.txt
            printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > $p/run/server.properties
            timeout 420 ./gradlew :$p:runServer --console=plain > $p-server.log 2>&1
            echo "=== $p tail"; tail -n 60 $p-server.log
            grep -q 'Done (' $p-server.log || { echo "$p server did not finish starting"; echo FAIL >> smoke.txt; }
            grep -Ei 'MixinApplyError|InvalidInjectionException|Mixin apply.*failed|Critical injection failure|InjectionError' $p-server.log && echo FAIL >> smoke.txt
            grep -i 'Started Hurricane' $p-server.log || echo "note: Hurricane init line not seen for $p"
          done
          test ! -f smoke.txt
      - name: Push jars + logs to build-output branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp fabric/build/libs/hurricane-fabric*.jar neoforge/build/libs/hurricane-neoforge*.jar /tmp/out/ 2>/dev/null; cp *-server.log inspect.txt /tmp/out/ 2>/dev/null; ls -la /tmp/out
          cd /tmp/out && git init -q -b build-output && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "build ${GITHUB_SHA}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-output
      - name: Publish to Modrinth (Fabric)
        if: ${{ success() && github.repository == 'onebeastchris/Hurricane-Modded' && github.ref_name == '1.21' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew fabric:modrinth

      - name: Publish to Modrinth (NeoForge)
        if: ${{ success() && github.repository == 'onebeastchris/Hurricane-Modded' && github.ref_name == '1.21' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew neoforge:modrinth

      - name: Archive Artifacts (fabric)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hurricane Fabric
          path: fabric/build/libs/hurricane-fabric-*.jar
          if-no-files-found: error
      - name: Archive Artifacts (neoforge)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hurricane NeoForge
          path: neoforge/build/libs/hurricane-neoforge-*.jar
          if-no-files-found: error
